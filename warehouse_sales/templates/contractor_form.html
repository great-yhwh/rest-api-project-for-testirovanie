{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-dark text-white py-3">
        <h5 class="card-title mb-0 fw-bold">{{ title }}</h5>
      </div>
      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-medium text-dark">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
            {% endif %}
          </div>
          {% endfor %}

          <div class="d-flex justify-content-end gap-2 mt-4 pt-2">
            <a href="{% url 'warehouse_sales:contractor_list' %}" class="btn btn-light border px-4">Отмена</a>
            <button type="submit" class="btn btn-primary px-4 shadow-sm">Сохранить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/imask"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var phoneInput = document.getElementById("phone-mask-input");
    if (phoneInput) {
      IMask(phoneInput, {
        mask: '+7 (000) 000-00-00'
      });
    }
  });
</script>
{% endblock %}
