{% extends 'base.html' %}

{% block content %}
<h2 class="fw-bold mb-4">Остатки товаров на складах</h2>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="py-3 ps-3">Склад</th>
                    <th class="py-3">Номенклатура</th>
                    <th class="py-3 text-end pe-3">Остаток</th>
                </tr>
                </thead>
                <tbody>
                {% for item in balances %}
                <tr>
                    <td class="ps-3 fw-semibold">{{ item.sklad_name }}</td>
                    <td>{{ item.nomenclature_name }}</td>
                    <td class="text-end pe-3">
                        <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle px-3 py-2 fs-6">
                            {{ item.balance }} шт.
                        </span>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted p-5">Нет данных об остатках</td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
